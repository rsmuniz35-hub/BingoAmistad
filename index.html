<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV - Bingo Amistad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0e14; color: #ffffff; padding: 20px; overflow-x: hidden; }
    .painel-tv { background: #161b22; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); }
    .bola-destaque { width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffea79, #f39c12); color: #000; font-size: 4rem; font-weight: 900; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 0 25px rgba(243, 156, 18, 0.6); }
    .grid-tv { display: grid; grid-template-columns: repeat(15, 1fr); gap: 6px; }
    .celula-tv { background: #21262d; border-radius: 6px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold; color: #484f58; }
    .celula-tv.sorteada { background: #238636; color: #ffffff; box-shadow: 0 0 10px rgba(35, 134, 54, 0.8); }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row g-4">
      <!-- Painel Esquerdo: Última Bola Sorteada -->
      <div class="col-md-4 text-center">
        <div class="painel-tv h-100 d-flex flex-column justify-content-center align-items-center">
          <h2 class="text-warning mb-4 fw-bold">ÚLTIMA BOLA</h2>
          <div id="bolaDestaque" class="bola-destaque">-</div>
          <h4 id="valorBaseTV" class="text-info mt-4">Valor Cartela: R$ 0,00</h4>
        </div>
      </div>

      <!-- Painel Direito: Globo Geral (1 a 75) -->
      <div class="col-md-8">
        <div class="painel-tv">
          <h3 class="text-center text-light mb-3 font-weight-bold">BINGO AMISTAD</h3>
          <div id="gridTV" class="grid-tv"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const db = firebase.database();

    // Monta Grid de 1 a 75 na TV
    const grid = document.getElementById('gridTV');
    for (let i = 1; i <= 75; i++) {
      const cel = document.createElement('div');
      cel.className = 'celula-tv';
      cel.id = `tv-num-${i}`;
      cel.innerText = i;
      grid.appendChild(cel);
    }

    // Escuta Bolas Sorteadas
    db.ref('sorteio/bolas').on('value', snapshot => {
      const sorteadas = snapshot.val() || {};
      for (let i = 1; i <= 75; i++) {
        const cel = document.getElementById(`tv-num-${i}`);
        if (sorteadas[i]) {
          cel.classList.add('sorteada');
        } else {
          cel.classList.remove('sorteada');
        }
      }
    });

    // Escuta Última Bola
    db.ref('sorteio/ultimaBola').on('value', snapshot => {
      const bola = snapshot.val() || '-';
      document.getElementById('bolaDestaque').innerText = bola;
    });

    // Escuta Valor Base Atual
    db.ref('configuracoes/valorBase').on('value', snapshot => {
      const val = snapshot.val() || 0;
      document.getElementById('valorBaseTV').innerText = `Valor Cartela: R$ ${val.toFixed(2)}`;
    });
  </script>
</body>
</html>
