<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle - Bingo Amistad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 20px; }
    .bola-sorteada { width: 50px; height: 50px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; margin: 3px; background-color: #0d6efd; color: white; }
    .grid-numeros { display: grid; grid-template-columns: repeat(15, 1fr); gap: 5px; }
    .num-btn { width: 100%; height: 40px; font-weight: bold; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4 text-center"> Painel de Controle - Bingo Amistad</h2>

    <!-- Configuração do Valor Base -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-primary text-white font-weight-bold">Configurações da Rodada</div>
      <div class="card-body">
        <div class="row g-3 align-items-center">
          <div class="col-auto">
            <label for="valorBaseInput" class="col-form-label">Valor Base por Cartela (R$):</label>
          </div>
          <div class="col-auto">
            <input type="number" id="valorBaseInput" class="form-control" step="0.50" value="10.00">
          </div>
          <div class="col-auto">
            <button id="btnSalvarValorBase" class="btn btn-primary">Atualizar Valor</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Atribuição de Nome ao Jogador -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-success text-white font-weight-bold">Vender / Atribuir Cartela ao Jogador</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-3">
            <input type="number" id="numCartelaInput" class="form-control" placeholder="Nº da Cartela (ex: 1)">
          </div>
          <div class="col-md-6">
            <input type="text" id="nomeJogadorInput" class="form-control" placeholder="Nome do Jogador">
          </div>
          <div class="col-md-3">
            <button id="btnAtribuirCartela" class="btn btn-success w-100">Vincular Jogador</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Painel de Sorteio e Controle -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-dark text-white font-weight-bold">Controle do Sorteio</div>
      <div class="card-body">
        <div class="d-flex gap-2 mb-3">
          <button id="btnNovoSorteio" class="btn btn-danger">Reiniciar Bingo (Limpar Rodada)</button>
        </div>
        <div class="mb-3">
          <h5>Última Bola Sorteada: <span id="ultimaBola" class="badge bg-warning text-dark fs-4">-</span></h5>
        </div>
        <h5>Glaustro de Números (1 a 75):</h5>
        <div id="gridNumeros" class="grid-numeros mb-3"></div>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const db = firebase.database();

    // Renderiza botões de 1 a 75
    const grid = document.getElementById('gridNumeros');
    for (let i = 1; i <= 75; i++) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-outline-secondary num-btn';
      btn.innerText = i;
      btn.id = `num-${i}`;
      btn.onclick = () => sortearNumero(i);
      grid.appendChild(btn);
    }

    // Sortear/Marcar Número
    function sortearNumero(num) {
      db.ref(`sorteio/bolas/${num}`).set(true);
      db.ref('sorteio/ultimaBola').set(num);
    }

    // Escutar Bolas Sorteadas
    db.ref('sorteio/bolas').on('value', snapshot => {
      const sorteadas = snapshot.val() || {};
      for (let i = 1; i <= 75; i++) {
        const btn = document.getElementById(`num-${i}`);
        if (sorteadas[i]) {
          btn.className = 'btn btn-primary num-btn';
        } else {
          btn.className = 'btn btn-outline-secondary num-btn';
        }
      }
    });

    db.ref('sorteio/ultimaBola').on('value', snapshot => {
      document.getElementById('ultimaBola').innerText = snapshot.val() || '-';
    });

    // Salvar Valor Base
    document.getElementById('btnSalvarValorBase').addEventListener('click', () => {
      const valor = parseFloat(document.getElementById('valorBaseInput').value) || 0;
      db.ref('configuracoes/valorBase').set(valor)
        .then(() => alert('Valor base atualizado!'))
        .catch(err => alert('Erro ao salvar: ' + err.message));
    });

    // Ler Valor Base
    db.ref('configuracoes/valorBase').on('value', snapshot => {
      const val = snapshot.val();
      if (val !== null) document.getElementById('valorBaseInput').value = val;
    });

    // Atribuir Jogador à Cartela
    document.getElementById('btnAtribuirCartela').addEventListener('click', () => {
      const numCartela = document.getElementById('numCartelaInput').value;
      const nomeJogador = document.getElementById('nomeJogadorInput').value.trim();

      if (!numCartela || numCartela <= 0) return alert('Informe o número da cartela!');
      if (!nomeJogador) return alert('Informe o nome do jogador!');

      db.ref(`cartelasCompradas/${numCartela}`).set({
        nome: nomeJogador,
        ativa: true,
        data: new Date().toISOString()
      })
      .then(() => {
        alert(`Cartela #${numCartela} atribuída com sucesso a ${nomeJogador}!`);
        document.getElementById('numCartelaInput').value = '';
        document.getElementById('nomeJogadorInput').value = '';
      })
      .catch(err => alert('Erro ao atribuir cartela: ' + err.message));
    });

    // Reiniciar Bingo
    document.getElementById('btnNovoSorteio').addEventListener('click', () => {
      if (confirm('Tem certeza que deseja reiniciar o bingo e limpar todas as bolas?')) {
        db.ref('sorteio').set({ bolas: {}, ultimaBola: '-' });
      }
    });
  </script>
</body>
</html>
