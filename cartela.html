<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Cartela - Bingo Amistad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #121212; color: #ffffff; padding: 15px; font-family: sans-serif; }
    .cartela-container { max-width: 450px; margin: 0 auto; background: #1e1e1e; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .header-cartela { text-align: center; margin-bottom: 15px; }
    .grid-cartela { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; text-align: center; }
    .celula { background: #2c2c2c; border-radius: 8px; padding: 12px 0; font-size: 1.2rem; font-weight: bold; cursor: pointer; user-select: none; }
    .celula.marcada { background: #28a745 !important; color: #fff; }
    .celula.sorteada-automatico { border: 2px solid #ffc107; }
    .topo-letra { font-size: 1.5rem; font-weight: 900; color: #ffc107; }
    .badge-valor { font-size: 0.9rem; background: #0d6efd; padding: 5px 10px; border-radius: 20px; }
  </style>
</head>
<body>
  <div class="cartela-container">
    <div class="header-cartela">
      <h3 id="nomeJogadorHeader" class="text-warning mb-1">Cartela #--</h3>
      <p id="infoJogador" class="text-muted mb-2">Jogador: Não atribuído</p>
      <span id="exibicaoValorBase" class="badge-valor">Valor: R$ 0,00</span>
    </div>

    <div class="grid-cartela mb-2">
      <div class="topo-letra">B</div>
      <div class="topo-letra">I</div>
      <div class="topo-letra">N</div>
      <div class="topo-letra">G</div>
      <div class="topo-letra">O</div>
    </div>

    <div id="gridNumerosCartela" class="grid-cartela"></div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const db = firebase.database();

    // Pega número da cartela da URL (?numero=X)
    const urlParams = new URLSearchParams(window.location.search);
    const numCartela = urlParams.get('numero') || '1';

    document.getElementById('nomeJogadorHeader').innerText = `Cartela #${numCartela}`;

    // Escuta Cadastro de Jogador para esta cartela
    db.ref(`cartelasCompradas/${numCartela}`).on('value', snapshot => {
      const dados = snapshot.val();
      if (dados && dados.nome) {
        document.getElementById('infoJogador').innerText = `Jogador: ${dados.nome}`;
      } else {
        document.getElementById('infoJogador').innerText = `Jogador: Livre / Disponível`;
      }
    });

    // Escuta Valor Base
    db.ref('configuracoes/valorBase').on('value', snapshot => {
      const val = snapshot.val() || 0;
      document.getElementById('exibicaoValorBase').innerText = `Valor por Cartela: R$ ${val.toFixed(2)}`;
    });

    // Gerador de Cartela Fictícia/Fixa baseado no número (para garantir matriz consistente)
    function gerarNumerosCartela(id) {
      let mat = [];
      let seed = parseInt(id) || 1;
      const getColumn = (min, max, count) => {
        let cols = [];
        for (let i = 0; i < count; i++) {
          let val = min + ((seed * (i + 1) * 7) % (max - min + 1));
          while (cols.includes(val)) { val = min + ((val + 1) % (max - min + 1)); }
          cols.push(val);
        }
        return cols;
      };
      let b = getColumn(1, 15, 5);
      let i = getColumn(16, 30, 5);
      let n = getColumn(31, 45, 5);
      let g = getColumn(46, 60, 5);
      let o = getColumn(61, 75, 5);
      
      for (let r = 0; r < 5; r++) {
        mat.push(b[r], i[r], (r === 2 ? 'X' : n[r]), g[r], o[r]);
      }
      return mat;
    }

    const numeros = gerarNumerosCartela(numCartela);
    const gridCartela = document.getElementById('gridNumerosCartela');

    numeros.forEach((num, index) => {
      const cel = document.createElement('div');
      cel.className = 'celula';
      if (num === 'X') {
        cel.innerText = '★';
        cel.classList.add('marcada');
      } else {
        cel.innerText = num;
        cel.onclick = () => cel.classList.toggle('marcada');
      }
      gridCartela.appendChild(cel);
    });
  </script>
</body>
</html>
